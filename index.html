<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Kaiserreich</title><style>:root{--navy:#17324d;--blue:#2878a8;--gold:#e4a928;--green:#2d9464;--red:#c94b4b}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eaf2f6;color:#17212b}.app{max-width:1050px;margin:auto;padding:18px}.hero{background:var(--navy);color:#fff;border-radius:18px;padding:24px}.hero h1{margin:0;font-size:2.4rem}.bar{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}.progress{height:12px;background:#ffffff44;border-radius:12px;flex:1}.progress i{display:block;height:100%;background:var(--gold);width:0%;border-radius:12px}.card{background:#fff;border-radius:18px;margin-top:18px;padding:24px;box-shadow:0 5px 18px #17324d22}.intro{background:#fff8e5;border-left:5px solid var(--gold);padding:15px;margin-top:16px;border-radius:8px}.mission{display:flex;justify-content:space-between;border-bottom:2px solid #e6eef2;padding-bottom:12px}.tag{color:var(--blue);font-weight:bold;background:#e6f1f6;border-radius:15px;padding:6px 10px}.question{font-size:1.25rem;font-weight:bold;line-height:1.4;margin:22px 0;color:#17212b;background:#fff}.answers{display:grid;gap:10px}.answer,.activity{border:2px solid #cddde5;background:#f7fbfd;color:#17212b;border-radius:12px;padding:13px;text-align:left;font-size:1rem;cursor:pointer}.answer:hover,.activity:hover{border-color:var(--blue)}.correct{background:#e5f6ed!important;border-color:var(--green)!important}.wrong{background:#fff0f0!important;border-color:var(--red)!important}.selected{background:#fff5d6!important;border-color:var(--gold)!important}.feedback{min-height:30px;margin-top:14px;font-weight:bold}.controls{display:flex;justify-content:space-between;margin-top:20px;gap:10px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer;background:var(--navy);color:#fff}button.secondary{background:#dce9ee;color:var(--navy)}button:disabled{opacity:.5}.hint{background:#f2f6f8;padding:12px;border-radius:10px;margin-top:12px}.hidden{display:none}.badge{display:inline-block;background:#fff0c2;border:1px solid var(--gold);border-radius:15px;padding:5px 10px;margin:3px}.big{font-size:3rem;text-align:center;font-weight:bold}.rank{text-align:center;color:var(--blue);font-size:1.3rem;font-weight:bold}.small{font-size:.9rem;color:#58707d}.learning{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.path{padding:12px;border-radius:12px;background:#edf6fa;border-top:5px solid var(--blue)}@media(max-width:650px){.learning{grid-template-columns:1fr}.card{padding:17px}}</style></head><body><main class="app"><section class="hero"><h1>Mission: Kaiserreich</h1><p>Reichseinigung · Verfassung · Modernität</p><div class="bar"><div class="progress"><i id="progress"></i></div><span id="counter">1/12</span><b>⭐ <span id="score">0</span></b></div></section><section class="intro"><b>Lernseite:</b> Bearbeite drei Lernpfade mit unterschiedlichen Aktivitäten.<div class="learning"><div class="path"><b>1. Reichseinigung</b><br>Chronologie und Wissenstest</div><div class="path"><b>2. Verfassung</b><br>Zuordnung und Wissenstest</div><div class="path"><b>3. Modernität</b><br>Einordnung und Urteil</div></div></section><section id="game" class="card"></section><section id="result" class="card hidden"></section></main><script>
const qs=[
['Reichseinigung','Welche Ausgangslage beschreibt Deutschland 1815?',['Ein Nationalstaat','Ein lockerer Deutscher Bund aus vielen Einzelstaaten','Eine Republik','Ein Kaiserreich'],1,'1815 bestand Deutschland aus vielen Einzelstaaten.'],
['Reichseinigung','Welche Forderungen verband die Nationalbewegung?',['Einheit, Freiheit, Verfassung und Mitbestimmung','Stärkung der Kleinstaaten','Abschaffung von Parlamenten','Herrschaft Frankreichs'],0,'Die Nationalbewegung verband nationale Einheit mit Freiheit.'],
['Reichseinigung','Warum scheiterte die Nationalversammlung 1848/49?',['Sie hatte zu viel Macht','Uneinigkeit, Widerstand der Fürsten und fehlende eigene Macht','Sie wollte keinen Nationalstaat','Sie wurde von Frankreich aufgelöst'],1,'Die Nationalversammlung konnte ihre Beschlüsse nicht durchsetzen.'],
['Chronologie','Ordne die Einigungskriege chronologisch.',null,[0,1,2],'1864 Dänemark → 1866 Österreich → 1870/71 Frankreich'],
['Verfassung','Welche Staatsform hatte das Kaiserreich?',['Parlamentarische Demokratie','Konstitutionelle Monarchie und Bundesstaat','Direkte Demokratie','Republik'],1,'Kaiser und Verfassung sowie 25 Bundesstaaten.'],
['Verfassung','Wer ernannte und entließ den Reichskanzler?',['Reichstag','Bundesrat','Deutscher Kaiser','Volk'],2,'Der Reichskanzler war vom Kaiser abhängig.'],
['Verfassung','Ordne zu: Reichstag, Bundesrat, Kaiser.',null,['Reichstag → gewählte Volksvertretung','Bundesrat → Vertretung der Länderregierungen','Kaiser → ernennt den Reichskanzler'],'Die Institutionen hatten unterschiedliche Funktionen.'],
['Verfassung','Was war problematisch an der Verfassung von 1871?',['Es gab keine Wahlen','Frauen waren ausgeschlossen und die Regierung war nicht parlamentarisch verantwortlich','Die Länder hatten keine Rechte','Der Kaiser wurde gewählt'],1,'Das Wahlrecht galt nur für Männer; der Reichstag kontrollierte die Regierung nur begrenzt.'],
['Modernität','Welches Beispiel steht für technischen Fortschritt?',['Elektrische U-Bahnen und Kraftwerke','Starke Stellung des Adels','Begrenzte Mitbestimmung','Starre Geschlechterrollen'],0,'Elektrifizierung und Verkehr modernisierten den Alltag.'],
['Modernität','Was zeigt gesellschaftliche Beharrung?',['Röntgenstrahlen','Frischwasserleitungen','Schlechte Arbeitsbedingungen und begrenzte Mitbestimmung','Neue Schulen'],2,'Modernisierung kam nicht allen zugute.'],
['Modernität','Welche Aussage ist am treffendsten?',['Nur modern','Nur rückständig','Widersprüchlich: Fortschritt und Beharrung','Kein Wandel'],2,'Technik und Wirtschaft modernisierten sich; Politik und Gesellschaft blieben teilweise traditionell.'],
['Urteil','Welche Schlussfolgerung ist am ausgewogensten?',['Einheit bedeutete automatisch Demokratie','Technischer Fortschritt beseitigte soziale Probleme','Die Reichsgründung brachte Einheit, aber nicht automatisch Demokratie','Militär und Adel spielten keine Rolle'],2,'Nationalstaat und Demokratie sind nicht dasselbe.']];
let i=0,score=0,answered=false,order=[];const game=document.getElementById('game');
function render(){answered=false;order=[];let m=qs[i];document.getElementById('counter').textContent=(i+1)+'/12';document.getElementById('progress').style.width=(i/12*100)+'%';let body='';if(i===3){body='<div class="answers">'+['1864: Krieg gegen Dänemark','1866: Krieg gegen Österreich','1870/71: Krieg gegen Frankreich'].map((x,n)=>`<button class="activity" data-n="${n}">${x}</button>`).join('')+'</div><p class="small">Klicke die Ereignisse in der richtigen Reihenfolge an.</p>'}else if(i===6){body='<div class="answers">'+m[2].map((x,n)=>`<button class="activity" data-n="${n}">${x}</button>`).join('')+'</div><p class="small">Klicke die Aussagen in der angegebenen Reihenfolge an.</p>'}else body='<div class="answers">'+m[2].map((x,n)=>`<button class="answer" data-n="${n}">${String.fromCharCode(65+n)}. ${x}</button>`).join('')+'</div>';game.innerHTML=`<div class="mission"><span class="tag">${m[0]}</span><span class="small">+10 Punkte</span></div><div class="question">${m[1]}</div>${body}<div id="feedback" class="feedback"></div><div class="controls"><button class="secondary" id="hint">Hinweis</button><button id="next" disabled>Nächste →</button></div><div id="hintbox" class="hint hidden">${m[4]}</div>`;document.getElementById('hint').onclick=()=>document.getElementById('hintbox').classList.toggle('hidden');document.getElementById('next').onclick=()=>{if(i<11){i++;render()}else finish()};if(i===3||i===6){document.querySelectorAll('.activity').forEach(b=>b.onclick=()=>activity(+b.dataset.n,b))}else document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.n,b))}
function answer(n,b){if(answered)return;answered=true;let m=qs[i];document.querySelectorAll('.answer').forEach(x=>x.disabled=true);if(n===m[3]){b.classList.add('correct');score+=10;document.getElementById('feedback').textContent='✅ Richtig! +10 Punkte'}else{b.classList.add('wrong');document.querySelectorAll('.answer')[m[3]].classList.add('correct');document.getElementById('feedback').textContent='❌ Nicht ganz. Die grüne Antwort ist richtig.'}document.getElementById('score').textContent=score;document.getElementById('next').disabled=false}
function activity(n,b){if(answered)return;let m=qs[i];b.classList.add('selected');order.push(n);if(order.length==3){answered=true;let good=i===3?order.join(',')==='0,1,2':order.join(',')==='0,1,2';if(good){score+=10;document.getElementById('score').textContent=score;document.getElementById('feedback').textContent='✅ Richtige Reihenfolge! +10 Punkte'}else document.getElementById('feedback').innerHTML='❌ Reihenfolge nicht ganz richtig.<br><span class="small">'+m[3]+'</span>';document.getElementById('next').disabled=false}}
function finish(){document.getElementById('progress').style.width='100%';game.classList.add('hidden');let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<div class="big">${score}/120</div><div class="rank">${score>=100?'🏆 Zeitdiagnostiker/in':score>=80?'⭐ Kaiserreich-Expert/in':score>=60?'📜 Quellenkundige/r':'🔎 Spurensucher/in'}</div><p>Du hast Reichseinigung, Verfassung und Modernität bearbeitet.</p><button onclick="location.reload()">Neu starten</button>`}render();</script></body></html>
