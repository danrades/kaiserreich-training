<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Kaiserreich</title><style>:root{--navy:#17324d;--blue:#2878a8;--gold:#e4a928;--green:#2d9464;--red:#c94b4b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eaf2f6;color:#17212b}.app{max-width:1050px;margin:auto;padding:18px}.hero{background:#17324d;color:#fff;border-radius:18px;padding:24px}.hero h1{margin:0;font-size:2.4rem}.bar{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}.progress{height:12px;background:#ffffff44;border-radius:12px;flex:1}.progress i{display:block;height:100%;background:#e4a928;width:0%;border-radius:12px}.card{background:#fff;border-radius:18px;margin-top:18px;padding:24px;box-shadow:0 5px 18px #17324d22}.intro{background:#fff8e5;border-left:5px solid #e4a928;padding:15px;margin-top:16px;border-radius:8px}.mission{display:flex;justify-content:space-between;border-bottom:2px solid #e6eef2;padding-bottom:12px}.tag{color:#17324d;background:#d9edf7;border-radius:15px;padding:6px 10px;font-weight:bold}.question{font-size:1.3rem;font-weight:bold;line-height:1.4;margin:22px 0;color:#111;background:#fff}.answers{display:grid;gap:12px}.answer,.activity{display:block;width:100%;border:2px solid #17324d;background:#ffffff!important;color:#111111!important;border-radius:12px;padding:14px;text-align:left;font-size:1rem;line-height:1.3;cursor:pointer}.answer:hover,.activity:hover{background:#eaf4f8!important;border-color:#2878a8}.correct{background:#dff3e7!important;border-color:#2d9464!important;color:#111!important}.wrong{background:#ffe3e3!important;border-color:#c94b4b!important;color:#111!important}.selected{background:#fff0bd!important;border-color:#e4a928!important;color:#111!important}.feedback{min-height:30px;margin-top:14px;font-weight:bold;color:#17212b}.controls{display:flex;justify-content:space-between;margin-top:20px;gap:10px}button{font-family:Arial,sans-serif}.controls button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer;background:#17324d;color:#fff}.controls .secondary{background:#dce9ee;color:#17324d}.controls button:disabled{opacity:.5}.hint{background:#f2f6f8;padding:12px;border-radius:10px;margin-top:12px;color:#17212b}.hidden{display:none}.learning{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.path{padding:12px;border-radius:12px;background:#edf6fa;border-top:5px solid #2878a8;color:#17212b}.small{font-size:.9rem;color:#4c6673}.big{font-size:3rem;text-align:center;font-weight:bold}.rank{text-align:center;color:#2878a8;font-size:1.3rem;font-weight:bold}@media(max-width:650px){.learning{grid-template-columns:1fr}.card{padding:17px}}</style></head><body><main class="app"><section class="hero"><h1>Mission: Kaiserreich</h1><p>Reichseinigung · Verfassung · Modernität</p><div class="bar"><div class="progress"><i id="progress"></i></div><span id="counter">1/12</span><b>⭐ <span id="score">0</span></b></div></section><section class="intro"><b>Lernseite:</b> Bearbeite drei Lernpfade mit unterschiedlichen Aktivitäten.<div class="learning"><div class="path"><b>1. Reichseinigung</b><br>Chronologie und Wissenstest</div><div class="path"><b>2. Verfassung</b><br>Zuordnung und Wissenstest</div><div class="path"><b>3. Modernität</b><br>Einordnung und Urteil</div></div></section><section id="game" class="card"></section><section id="result" class="card hidden"></section></main><script>const qs=[['Reichseinigung','Welche Ausgangslage beschreibt Deutschland 1815?',['Ein Nationalstaat','Ein lockerer Deutscher Bund aus vielen Einzelstaaten','Eine Republik','Ein Kaiserreich'],1,'1815 bestand Deutschland aus vielen Einzelstaaten.'],['Reichseinigung','Welche Forderungen verband die Nationalbewegung?',['Einheit, Freiheit, Verfassung und Mitbestimmung','Stärkung der Kleinstaaten','Abschaffung von Parlamenten','Herrschaft Frankreichs'],0,'Die Nationalbewegung verband nationale Einheit mit Freiheit.'],['Reichseinigung','Warum scheiterte die Nationalversammlung 1848/49?',['Sie hatte zu viel Macht','Uneinigkeit, Widerstand der Fürsten und fehlende eigene Macht','Sie wollte keinen Nationalstaat','Sie wurde von Frankreich aufgelöst'],1,'Die Nationalversammlung konnte ihre Beschlüsse nicht durchsetzen.'],['Chronologie','Ordne die Einigungskriege chronologisch.',null,'1864 Dänemark → 1866 Österreich → 1870/71 Frankreich',''],['Verfassung','Welche Staatsform hatte das Kaiserreich?',['Parlamentarische Demokratie','Konstitutionelle Monarchie und Bundesstaat','Direkte Demokratie','Republik'],1,'Kaiser und Verfassung sowie 25 Bundesstaaten.'],['Verfassung','Wer ernannte und entließ den Reichskanzler?',['Reichstag','Bundesrat','Deutscher Kaiser','Volk'],2,'Der Reichskanzler war vom Kaiser abhängig.'],['Verfassung','Ordne zu: Reichstag, Bundesrat, Kaiser.',null,'Reichstag → gewählte Volksvertretung | Bundesrat → Länderregierungen | Kaiser → ernennt den Reichskanzler',''],['Verfassung','Was war problematisch an der Verfassung von 1871?',['Es gab keine Wahlen','Frauen waren ausgeschlossen und die Regierung war nicht parlamentarisch verantwortlich','Die Länder hatten keine Rechte','Der Kaiser wurde gewählt'],1,'Das Wahlrecht galt nur für Männer; der Reichstag kontrollierte die Regierung nur begrenzt.'],['Modernität','Welches Beispiel steht für technischen Fortschritt?',['Elektrische U-Bahnen und Kraftwerke','Starke Stellung des Adels','Begrenzte Mitbestimmung','Starre Geschlechterrollen'],0,'Elektrifizierung und Verkehr modernisierten den Alltag.'],['Modernität','Was zeigt gesellschaftliche Beharrung?',['Röntgenstrahlen','Frischwasserleitungen','Schlechte Arbeitsbedingungen und begrenzte Mitbestimmung','Neue Schulen'],2,'Modernisierung kam nicht allen zugute.'],['Modernität','Welche Aussage ist am treffendsten?',['Nur modern','Nur rückständig','Widersprüchlich: Fortschritt und Beharrung','Kein Wandel'],2,'Technik und Wirtschaft modernisierten sich; Politik und Gesellschaft blieben teilweise traditionell.'],['Urteil','Welche Schlussfolgerung ist am ausgewogensten?',['Einheit bedeutete automatisch Demokratie','Technischer Fortschritt beseitigte soziale Probleme','Die Reichsgründung brachte Einheit, aber nicht automatisch Demokratie','Militär und Adel spielten keine Rolle'],2,'Nationalstaat und Demokratie sind nicht dasselbe.']];let i=0,score=0,answered=false,order=[];const game=document.getElementById('game');function render(){answered=false;order=[];let m=qs[i],body='';document.getElementById('counter').textContent=(i+1)+'/12';document.getElementById('progress').style.width=(i/12*100)+'%';if(i==3){body='<div class="answers">'+['1864: Krieg gegen Dänemark','1866: Krieg gegen Österreich','1870/71: Krieg gegen Frankreich'].map((x,n)=>`<button class="activity" data-n="${n}">${x}</button>`).join('')+'</div><p class="small">Klicke die Ereignisse in der richtigen Reihenfolge an.</p>'}else if(i==6){body='<div class="answers">'+['Reichstag → gewählte Volksvertretung','Bundesrat → Vertretung der Länderregierungen','Kaiser → ernennt den Reichskanzler'].map((x,n)=>`<button class="activity" data-n="${n}">${x}</button>`).join('')+'</div><p class="small">Klicke die Aussagen in der angegebenen Reihenfolge an.</p>'}else body='<div class="answers">'+m[2].map((x,n)=>`<button class="answer" data-n="${n}">${String.fromCharCode(65+n)}. ${x}</button>`).join('')+'</div>';game.innerHTML=`<div class="mission"><span class="tag">${m[0]}</span><span class="small">+10 Punkte</span></div><div class="question">${m[1]}</div>${body}<div id="feedback" class="feedback"></div><div class="controls"><button class="secondary" id="hint">Hinweis</button><button id="next">Nächste →</button></div><div id="hintbox" class="hint hidden">${m[4]}</div>`;document.getElementById('hint').onclick=()=>document.getElementById('hintbox').classList.toggle('hidden');document.getElementById('next').onclick=()=>{if(i<11){i++;render()}else finish()};document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.n,b));document.querySelectorAll('.activity').forEach(b=>b.onclick=()=>activity(+b.dataset.n,b))}function answer(n,b){if(answered)return;answered=true;let m=qs[i];document.querySelectorAll('.answer').forEach(x=>x.disabled=true);if(n===m[3]){b.classList.add('correct');score+=10;document.getElementById('feedback').textContent='✅ Richtig! +10 Punkte'}else{b.classList.add('wrong');document.querySelectorAll('.answer')[m[3]].classList.add('correct');document.getElementById('feedback').textContent='❌ Nicht ganz. Die grüne Antwort ist richtig.'}document.getElementById('score').textContent=score}function activity(n,b){if(answered)return;b.classList.add('selected');order.push(n);if(order.length==3){answered=true;let good=order.join(',')==='0,1,2';if(good){score+=10;document.getElementById('score').textContent=score;document.getElementById('feedback').textContent='✅ Richtige Reihenfolge! +10 Punkte'}else document.getElementById('feedback').textContent='❌ Prüfe die Reihenfolge noch einmal.'}}function finish(){document.getElementById('progress').style.width='100%';game.classList.add('hidden');let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<div class="big">${score}/120</div><div class="rank">${score>=100?'🏆 Zeitdiagnostiker/in':score>=80?'⭐ Kaiserreich-Expert/in':score>=60?'📜 Quellenkundige/r':'🔎 Spurensucher/in'}</div><p>Du hast Reichseinigung, Verfassung und Modernität bearbeitet.</p><button onclick="location.reload()">Neu starten</button>`}render();</script></body></html>
