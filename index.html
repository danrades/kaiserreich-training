<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Kaiserreich</title><style>body{margin:0;font-family:Arial;background:#eaf2f6;color:#111}.app{max-width:1050px;margin:auto;padding:18px}.hero,.card{border-radius:18px;padding:24px}.hero{background:#17324d;color:#fff}.hero h1{margin:0}.card{background:#fff;margin-top:18px;box-shadow:0 5px 18px #17324d22}.intro{background:#fff8e5;padding:15px;border-left:5px solid #e4a928;margin-top:16px}.bar{display:flex;gap:12px;align-items:center;margin-top:16px}.progress{height:12px;background:#ffffff44;border-radius:12px;flex:1}.progress i{display:block;height:100%;background:#e4a928;width:0%;border-radius:12px}.tag{background:#d9edf7;border-radius:15px;padding:6px 10px;font-weight:bold}.mission{display:flex;justify-content:space-between;border-bottom:2px solid #e6eef2;padding-bottom:12px}.question{font-size:1.3rem;font-weight:bold;margin:22px 0}.answer,.tile,.chip,.scaleOpt{display:block;width:100%;border:2px solid #17324d;background:#fff;color:#111;border-radius:12px;padding:14px;text-align:left;font-size:1rem;cursor:pointer;margin:8px 0}.answer:hover,.tile:hover{background:#eaf4f8}.selected{background:#fff0bd!important;border-color:#e4a928!important}.correct{background:#dff3e7!important;border-color:#237a4b!important}.wrong{background:#ffe3e3!important;border-color:#b33131!important}.feedback{min-height:30px;margin-top:14px;font-weight:bold}.controls{display:flex;justify-content:space-between;margin-top:20px}.controls button{border:0;border-radius:10px;padding:11px 16px;background:#17324d;color:#fff;font-weight:bold}.secondary{background:#dce9ee!important;color:#17324d!important}.hidden{display:none}.hint{background:#f2f6f8;padding:12px;margin-top:10px}.matchSelect{display:block;width:100%;margin-top:8px;padding:10px;border:2px solid #17324d;border-radius:8px;color:#111;background:#fff}.small{font-size:.9rem;color:#4c6673}.textanswer{width:100%;min-height:90px;color:#111;border:2px solid #17324d;border-radius:10px;padding:10px}@media(max-width:700px){.card{padding:17px}}</style></head><body><main class="app"><section class="hero"><h1>Mission: Kaiserreich</h1><p>Reichseinigung · Verfassung · Modernität</p><div class="bar"><div class="progress"><i id="progress"></i></div><span id="counter"></span><b>⭐ <span id="score">0</span></b></div></section><section class="intro"><b>Lernseite:</b> Bearbeite abwechslungsreiche Aktivitäten zu Reichseinigung, Verfassung und Modernität.</section><section id="game" class="card"></section><section id="result" class="card hidden"></section></main><script>
const qs=[{type:'mc',cat:'Reichseinigung',q:'Welche Ausgangslage beschreibt Deutschland 1815?',opts:['Ein Nationalstaat','Ein lockerer Deutscher Bund aus vielen Einzelstaaten','Eine Republik','Ein Kaiserreich'],a:1,h:'1815 bestand Deutschland aus vielen Einzelstaaten.'},{type:'blank',cat:'Reichseinigung',q:'Setze ein: Die Nationalbewegung forderte ______ und ______. 1848/49 sollte die Nationalversammlung einen ______ schaffen.',chips:['Einheit','Freiheit','Nationalstaat','Kaiser','Militär'],a:['Einheit','Freiheit','Nationalstaat'],h:'Denke an die Forderungen der Nationalbewegung.'},{type:'sort',cat:'Reichseinigung',q:'Bringe die Entwicklungsschritte in die richtige Reihenfolge.',items:['Reichsgründung in Versailles','Revolution und Nationalversammlung','Krieg gegen Österreich','Krieg gegen Dänemark','Krieg gegen Frankreich'],a:[1,3,2,4,0],h:'Beginne mit dem Einigungsversuch von 1848/49.'},{type:'mc',cat:'Reichseinigung',q:'Warum scheiterte die Nationalversammlung?',opts:['Sie hatte zu viel Macht','Uneinigkeit, Widerstand der Fürsten und fehlende eigene Macht','Sie wollte keinen Nationalstaat','Sie wurde von Frankreich gewählt'],a:1,h:'Die Nationalversammlung konnte ihre Beschlüsse nicht durchsetzen.'},{type:'match',cat:'Verfassung',q:'Wähle für jede Institution die passende Funktion.',items:['Kaiser','Reichstag','Bundesrat'],targets:['ernennt den Reichskanzler','gewählte Volksvertretung und Mitwirkung an der Gesetzgebung','Vertretung der Länderregierungen und Mitwirkung an Gesetzen'],a:[0,1,2],h:'Der Kaiser stand an der Spitze; Reichstag und Bundesrat hatten unterschiedliche Aufgaben.'},{type:'tf',cat:'Verfassung',q:'Richtig oder falsch?',statements:['Frauen durften den Reichstag wählen.','Der Reichskanzler wurde vom Kaiser ernannt.','Der Reichstag konnte den Reichskanzler absetzen.','Das Kaiserreich war eine konstitutionelle Monarchie.'],a:[false,true,false,true],h:'Prüfe Wahlrecht, Ernennung und Staatsform.'},{type:'mc',cat:'Verfassung',q:'Was war an der Verfassung von 1871 problematisch?',opts:['Es gab keine Wahlen','Frauen waren ausgeschlossen und die Regierung war nicht parlamentarisch verantwortlich','Die Länder hatten keine Rechte','Der Kaiser wurde direkt gewählt'],a:1,h:'Der Reichstag kontrollierte die Regierung nur begrenzt.'},{type:'cat',cat:'Modernität',q:'Ordne ein: Modernisierung oder Beharrung?',items:['Elektrische U-Bahn','Röntgenstrahlen','Schlechte Arbeitsbedingungen','Starke Stellung des Adels','Neue Mädchenschulen','Begrenzte politische Mitbestimmung'],a:['modern','modern','traditionell','traditionell','modern','traditionell'],h:'Technik und Wissenschaft stehen nicht automatisch für politische Gleichheit.'},{type:'mc',cat:'Modernität',q:'Welches Beispiel steht für technischen Fortschritt?',opts:['Elektrische U-Bahnen und Kraftwerke','Starke Stellung des Adels','Begrenzte Mitbestimmung','Starre Geschlechterrollen'],a:0,h:'Elektrifizierung und Verkehr veränderten den Alltag.'},{type:'scale',cat:'Modernität',q:'Wie würdest du das Kaiserreich insgesamt einordnen?',opts:['überwiegend modern','widersprüchlich','überwiegend rückständig'],a:1,h:'Berücksichtige Technik, Wirtschaft, Politik und Gesellschaft.'},{type:'text',cat:'Urteil',q:'Formuliere ein historisches Kurzurteil: Warum war das Kaiserreich modern und zugleich traditionell?',h:'Nenne je einen Beleg für Fortschritt und Beharrung.'},{type:'mc',cat:'Urteil',q:'Welche Schlussfolgerung ist am ausgewogensten?',opts:['Die Reichsgründung brachte automatisch Demokratie','Technischer Fortschritt beseitigte soziale Probleme','Die Reichsgründung brachte Einheit, aber nicht automatisch Demokratie','Militär und Adel spielten keine Rolle mehr'],a:2,h:'Nationalstaat und Demokratie sind nicht dasselbe.'}];let i=0,score=0,answered=false,sequence=[];const game=document.getElementById('game');function render(){answered=false;sequence=[];let m=qs[i],body='';document.getElementById('counter').textContent=(i+1)+'/12';document.getElementById('progress').style.width=(i/12*100)+'%';if(m.type==='mc')body='<div>'+m.opts.map((x,n)=>`<button class="answer" data-n="${n}">${String.fromCharCode(65+n)}. ${x}</button>`).join('')+'</div>';if(m.type==='blank')body='<div>'+m.chips.map(x=>`<button class="chip" data-word="${x}">${x}</button>`).join('')+'</div><div class="hint">Wähle drei passende Begriffe.</div>';if(m.type==='sort')body='<div class="hint"><b>Deine Reihenfolge:</b><ol id="chosen"></ol></div><div>'+m.items.map((x,n)=>`<button class="tile" data-n="${n}">${x}</button>`).join('')+'</div><p class="small">Klicke die Ereignisse in der richtigen Reihenfolge an.</p>';if(m.type==='match')body='<div>'+m.items.map((x,n)=>`<div class="hint"><b>${x}</b><select class="matchSelect" data-n="${n}"><option value="">-- Funktion wählen --</option>${m.targets.map((t,j)=>`<option value="${j}">${t}</option>`).join('')}</select></div>`).join('')+'</div>';if(m.type==='tf')body='<div>'+m.statements.map((x,n)=>`<div class="hint"><b>${x}</b><br><button class="answer tf" data-n="${n}" data-v="true">Richtig</button><button class="answer tf" data-n="${n}" data-v="false">Falsch</button></div>`).join('')+'</div>';if(m.type==='cat')body='<div>'+m.items.map((x,n)=>`<div class="hint"><b>${x}</b><br><button class="answer cat" data-n="${n}" data-v="modern">Modernisierung</button><button class="answer cat" data-n="${n}" data-v="traditionell">Beharrung</button></div>`).join('')+'</div>';if(m.type==='scale')body='<div>'+m.opts.map((x,n)=>`<button class="scaleOpt tile" data-n="${n}">${x}</button>`).join('')+'</div>';if(m.type==='text')body='<textarea class="textanswer" id="textanswer" placeholder="Dein Kurzurteil …"></textarea>';game.innerHTML=`<div class="mission"><span class="tag">${m.cat}</span><span class="small">+10 Punkte</span></div><div class="question">${m.q}</div>${body}<div id="feedback" class="feedback"></div><div class="controls"><button class="secondary" id="hint">Hinweis</button><button id="check">Prüfen</button></div><div id="hintbox" class="hint hidden">${m.h}</div>`;document.getElementById('hint').onclick=()=>document.getElementById('hintbox').classList.toggle('hidden');document.getElementById('check').onclick=check;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>pick(b));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>tile(+b.dataset.n,b));}function pick(b){if(answered)return;if(b.classList.contains('tf')||b.classList.contains('cat')){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}else{document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}}function tile(n,b){if(answered)return;if(qs[i].type==='sort'){b.disabled=true;b.classList.add('selected');sequence.push(n);let li=document.createElement('li');li.textContent=qs[i].items[n];document.getElementById('chosen').appendChild(li)}else{b.classList.add('selected');sequence.push(n)}}function check(){if(answered)return;let m=qs[i],ok=false;if(m.type==='mc'){let b=document.querySelector('.answer.selected');if(!b){document.getElementById('feedback').textContent='Bitte wähle eine Antwort.';return}ok=+b.dataset.n===m.a}else if(m.type==='blank'){let c=[...document.querySelectorAll('.chip.selected')].map(x=>x.dataset.word);ok=c.length===3&&m.a.every(x=>c.includes(x))}else if(m.type==='sort'){ok=sequence.length===m.a.length&&sequence.every((x,k)=>x===m.a[k])}else if(m.type==='match'){let v=[...document.querySelectorAll('.matchSelect')].map(x=>x.value);ok=v.length===3&&v.every(x=>x!=='')&&v.every((x,n)=>+x===m.a[n])}else if(m.type==='tf'){ok=m.a.every((v,n)=>document.querySelector(`.tf[data-n="${n}"].selected`)?.dataset.v===String(v))}else if(m.type==='cat'){ok=m.a.every((v,n)=>document.querySelector(`.cat[data-n="${n}"][data-v="${v}"]`)?.classList.contains('selected'))}else if(m.type==='scale'){ok=document.querySelector('.scaleOpt.selected')?.dataset.n==='1'}else if(m.type==='text'){ok=document.getElementById('textanswer').value.trim().length>=40}answered=true;if(ok){score+=10;document.getElementById('feedback').textContent='✅ Richtig beziehungsweise sinnvoll bearbeitet! +10 Punkte';document.getElementById('score').textContent=score}else document.getElementById('feedback').textContent='❌ Noch nicht vollständig oder nicht passend. Nutze den Hinweis.';document.getElementById('check').textContent=i===11?'Auswertung':'Nächste Aufgabe';document.getElementById('check').onclick=()=>{if(i<11){i++;render()}else finish()}}function finish(){document.getElementById('progress').style.width='100%';game.classList.add('hidden');let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<h2>Auswertung</h2><div style="font-size:3rem;text-align:center;font-weight:bold">${score}/120</div><p style="text-align:center">${score>=100?'🏆 Zeitdiagnostiker/in':score>=80?'⭐ Kaiserreich-Expert/in':score>=60?'📜 Quellenkundige/r':'🔎 Spurensucher/in'}</p><button onclick="location.reload()">Neu starten</button>`}render();</script></body></html>
