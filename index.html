<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Kaiserreich</title>
<style>
:root{--navy:#17324d;--blue:#2878a8;--gold:#e4a928;--green:#2d9464;--red:#c94b4b;--bg:#eef4f7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4f7,#d9e8ef);color:#17212b}
.app{max-width:1050px;margin:auto;padding:18px}.hero{background:var(--navy);color:white;border-radius:18px;padding:24px 28px;box-shadow:0 8px 22px #17324d33}.hero h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,3rem)}.hero p{margin:4px 0}.bar{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}.progress{height:13px;background:#ffffff33;border-radius:20px;flex:1;min-width:180px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);width:0%;transition:.4s}.score{font-weight:bold;color:#ffe49a}.card{background:white;border-radius:18px;margin-top:18px;padding:24px;box-shadow:0 5px 18px #17324d22}.mission{display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:2px solid #e7eef2;padding-bottom:12px}.tag{background:#e6f1f6;color:var(--blue);border-radius:18px;padding:6px 10px;font-weight:bold;font-size:.85rem}.question{font-size:1.2rem;font-weight:bold;line-height:1.35;margin:20px 0}.answers{display:grid;gap:10px}.answer{border:2px solid #d4e1e7;background:#f8fbfc;border-radius:12px;padding:13px;text-align:left;font-size:1rem;cursor:pointer;transition:.15s}.answer:hover{border-color:var(--blue);transform:translateY(-1px)}.answer.correct{border-color:var(--green);background:#e8f7ef}.answer.wrong{border-color:var(--red);background:#fff0f0}.feedback{min-height:26px;margin-top:14px;font-weight:bold}.controls{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer;background:var(--navy);color:white}button.secondary{background:#dce9ee;color:var(--navy)}button:disabled{opacity:.45;cursor:not-allowed}.intro{background:#fff8e5;border-left:5px solid var(--gold);padding:14px;border-radius:8px;margin-top:16px}.badge{display:inline-block;background:#fff0c2;border:1px solid #e4a928;color:#7d5a00;border-radius:16px;padding:5px 10px;margin:4px 4px 0 0;font-size:.85rem}.hidden{display:none}.summary{text-align:center}.summary .big{font-size:3rem;color:var(--navy);font-weight:bold}.rank{font-size:1.3rem;color:var(--blue);font-weight:bold}.small{font-size:.9rem;color:#51636d}.source{margin-top:14px;background:#f2f6f8;border-radius:10px;padding:12px;font-size:.93rem;line-height:1.45}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match-grid button{text-align:left;background:#f8fbfc;color:#17212b;border:2px solid #d4e1e7}.match-grid button.selected{border-color:var(--gold);background:#fff8e5}.match-grid button.done{border-color:var(--green);background:#e8f7ef}
@media(max-width:650px){.card{padding:17px}.match-grid{grid-template-columns:1fr}.mission{display:block}}
</style>
</head>
<body><main class="app">
<section class="hero"><h1>Mission: Kaiserreich</h1><p>Reichseinigung · Verfassung · Modernität</p><div class="bar"><div class="progress"><i id="progress"></i></div><span id="level">Mission 1/12</span><span class="score">⭐ <span id="score">0</span> Punkte</span></div></section>
<div class="intro"><b>Spielidee:</b> Löse zwölf Missionen. Für jede richtige Lösung erhältst du Punkte und gelegentlich ein Abzeichen. Lies genau: Einige Aufgaben verlangen eine Einordnung, andere ein historisches Urteil.</div>
<section id="game" class="card"></section><section id="result" class="card summary hidden"></section>
</main>
<script>
const missions=[
{cat:'Reichseinigung',q:'Welche Ausgangslage beschreibt Deutschland im Jahr 1815 am besten?',opts:['Ein einheitlicher Nationalstaat mit gemeinsamer Regierung','Ein lockerer Deutscher Bund aus vielen Einzelstaaten','Ein Kaiserreich unter Wilhelm I.','Ein republikanischer Bundesstaat'],a:1,why:'1815 entstand der Deutsche Bund aus 39 Einzelstaaten; ein deutscher Nationalstaat existierte noch nicht.'},
{cat:'Reichseinigung',q:'Was forderte die Nationalbewegung im Vormärz und in der Revolution 1848/49?',opts:['Nur die Stärkung der Einzelstaaten','Einheit, Freiheit, Verfassung und politische Mitbestimmung','Die Abschaffung aller Parlamente','Eine Herrschaft Österreichs über ganz Europa'],a:1,why:'Nationale Einheit wurde mit liberalen und demokratischen Forderungen verbunden.'},
{cat:'Reichseinigung',q:'Warum scheiterte die Nationalversammlung von 1848/49?',opts:['Sie hatte zu viel militärische Macht','Sie war politisch uneinig und konnte ihre Beschlüsse nicht durchsetzen','Sie lehnte einen Nationalstaat grundsätzlich ab','Sie wurde von Frankreich gewählt'],a:1,why:'Uneinigkeit, Widerstand der Fürsten und fehlende eigene Macht schwächten die Nationalversammlung.'},
{cat:'Reichseinigung',q:'Welche Reihenfolge der Einigungskriege ist richtig?',opts:['Frankreich – Dänemark – Österreich','Österreich – Frankreich – Dänemark','Dänemark – Österreich – Frankreich','Dänemark – Frankreich – Österreich'],a:2,why:'Preußen kämpfte 1864 gegen Dänemark, 1866 gegen Österreich und 1870/71 gegen Frankreich.'},
{cat:'Verfassung',q:'Welche Staatsform hatte das Deutsche Kaiserreich?',opts:['Parlamentarische Demokratie','Konstitutionelle Monarchie und Bundesstaat','Direkte Demokratie','Absolute Republik'],a:1,why:'Es gab einen Kaiser und eine Verfassung sowie 25 Bundesstaaten.'},
{cat:'Verfassung',q:'Wer ernannte und entließ den Reichskanzler?',opts:['Der Reichstag','Der Bundesrat allein','Der Deutsche Kaiser','Die Bevölkerung in einer Direktwahl'],a:2,why:'Der Reichskanzler war vom Kaiser abhängig, nicht vom Vertrauen des Reichstags.'},
{cat:'Verfassung',q:'Welche Aussage über den Reichstag trifft zu?',opts:['Er konnte den Kaiser absetzen.','Er wurde von Männern über 25 Jahren gewählt und wirkte an der Gesetzgebung mit.','Er ernannte den Reichskanzler.','Er vertrat ausschließlich die Landesregierungen.'],a:1,why:'Der Reichstag war gewählt und an Gesetzen beteiligt, kontrollierte die Regierung aber nur begrenzt.'},
{cat:'Verfassung',q:'Was war an der Verfassung von 1871 problematisch?',opts:['Es gab überhaupt keine Wahlen.','Frauen waren ausgeschlossen und die Regierung war nicht parlamentarisch verantwortlich.','Die Länder hatten keinerlei Rechte.','Der Kaiser wurde direkt vom Volk gewählt.'],a:1,why:'Die Verfassung enthielt kein Frauenwahlrecht und keine parlamentarische Verantwortlichkeit der Regierung.'},
{cat:'Modernität',q:'Welches Beispiel steht für technischen Fortschritt?',opts:['Elektrische U-Bahnen und Kraftwerke','Die starke Stellung des Adels','Begrenzte politische Mitbestimmung','Starre Geschlechterrollen'],a:0,why:'Elektrifizierung, Verkehr, Industrie und Wissenschaft veränderten den Alltag.'},
{cat:'Modernität',q:'Welches Beispiel zeigt soziale oder politische Beharrung?',opts:['Röntgenstrahlen','Frischwasserleitungen','Schlechte Arbeitsbedingungen und begrenzte politische Mitbestimmung','Neue naturwissenschaftliche Schulen'],a:2,why:'Modernisierung kam nicht allen zugute; traditionelle Machtverhältnisse und soziale Ungleichheit blieben bestehen.'},
{cat:'Modernität',q:'Welche Aussage beschreibt das Kaiserreich am treffendsten?',opts:['Es war ausschließlich modern.','Es war ausschließlich rückständig.','Es war eine widersprüchliche Gesellschaft zwischen Fortschritt und Beharrung.','Es gab keinen gesellschaftlichen Wandel.'],a:2,why:'Technik und Wirtschaft modernisierten sich, während Politik und Gesellschaft teilweise traditionell blieben.'},
{cat:'Urteil',q:'Welche Schlussfolgerung ist historisch am ausgewogensten?',opts:['Die Reichsgründung brachte Einheit, aber nicht automatisch Demokratie.','Technischer Fortschritt beseitigte alle sozialen Probleme.','Die Verfassung war bereits eine moderne Demokratie im heutigen Sinn.','Militär und Adel spielten nach 1871 keine Rolle mehr.'],a:0,why:'1871 entstand ein Nationalstaat; demokratische Mitbestimmung und soziale Gleichheit waren jedoch begrenzt.'}
];
let i=0,score=0,answered=false,badges=[];
const game=document.getElementById('game'), result=document.getElementById('result');
function render(){answered=false; const m=missions[i]; document.getElementById('level').textContent=`Mission ${i+1}/${missions.length}`; document.getElementById('progress').style.width=(i/missions.length*100)+'%'; game.innerHTML=`<div class="mission"><span class="tag">${m.cat}</span><span class="small">+10 ⭐ für richtig</span></div><div class="question">${m.q}</div><div class="answers">${m.opts.map((o,n)=>`<button class="answer" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="controls"><button class="secondary" id="hint">Hinweis anzeigen</button><button id="next" disabled>${i===missions.length-1?'Auswertung':'Nächste Mission'} →</button></div><div class="source hidden" id="hintbox">${m.why}</div>`;
 document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.n,b)); document.getElementById('next').onclick=next; document.getElementById('hint').onclick=()=>document.getElementById('hintbox').classList.toggle('hidden');}
function answer(n,b){if(answered)return; answered=true; const m=missions[i]; document.querySelectorAll('.answer').forEach(x=>x.disabled=true); if(n===m.a){b.classList.add('correct'); score+=10; document.getElementById('feedback').innerHTML='✅ Richtig! +10 Punkte';}else{b.classList.add('wrong');document.querySelectorAll('.answer')[m.a].classList.add('correct');document.getElementById('feedback').innerHTML='❌ Nicht ganz. Die grüne Antwort ist richtig.';} document.getElementById('score').textContent=score; document.getElementById('next').disabled=false; if(score>=40&&!badges.includes('Chronist')){badges.push('Chronist');document.getElementById('feedback').innerHTML+=' <span class="badge">🏅 Abzeichen: Chronist</span>';} if(score>=90&&!badges.includes('Zeitdiagnostiker')){badges.push('Zeitdiagnostiker');document.getElementById('feedback').innerHTML+=' <span class="badge">🏆 Abzeichen: Zeitdiagnostiker</span>';}}
function next(){if(i<missions.length-1){i++;render();}else finish();}
function finish(){document.getElementById('progress').style.width='100%';game.classList.add('hidden');result.classList.remove('hidden');let rank=score>=100?'🏆 Zeitdiagnostiker/in':score>=80?'⭐ Kaiserreich-Expert/in':score>=60?'📜 Quellenkundige/r':'🔎 Spurensucher/in';result.innerHTML=`<div class="big">${score}/120</div><div class="rank">${rank}</div><p>Du hast die Missionen zu Reichseinigung, Verfassung und Modernität abgeschlossen.</p><p>${badges.map(x=>`<span class="badge">🏅 ${x}</span>`).join(' ')||'Keine Abzeichen'}</p><button onclick="location.reload()">Mission neu starten</button>`;}
render();
</script></body></html>
